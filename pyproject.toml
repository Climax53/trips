[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trips-cli"
version = "0.2.0"
description = "One conversation with three AI coding tools at once: one conducts, all three work, you get one answer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
trips = "trips_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trips_tool = ["train.txt"]
